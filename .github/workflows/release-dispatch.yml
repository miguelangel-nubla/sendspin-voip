name: Automated Release Dispatch

on:
  workflow_dispatch:
    inputs:
      bump:
        description: 'Version bump type (patch, minor, major) or explicit version (e.g. 1.0.2)'
        required: true
        default: 'patch'
        type: string

permissions:
  contents: write
  packages: write

jobs:
  release:
    name: Prepare and Tag Release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.26'
          cache: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Configure Git User
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Run Release Automation
        run: |
          chmod +x ./scripts/release.sh
          ./scripts/release.sh "${{ github.event.inputs.bump }}"

      - name: Push Changes and Tag
        run: |
          git push origin main --follow-tags
