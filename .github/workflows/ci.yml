name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.26'
          cache: true

      - name: Check formatting
        run: |
          out="$(gofmt -s -l .)"
          if [ -n "$out" ]; then
            echo "The following files are not gofmt'd:"
            echo "$out"
            exit 1
          fi

      - name: Vet
        run: go vet ./...

      # Run the suite under the same build constraints as the shipped binary,
      # so what CI proves is what ships.
      - name: Run Tests (production build flags)
        run: CGO_ENABLED=0 go test -v ./...

      # The race detector is implemented in C and therefore requires cgo:
      # `CGO_ENABLED=0 go test -race` fails outright with "-race requires cgo".
      # This step runs natively on the amd64 runner and never cross-compiles,
      # so it does not weaken the CGO_ENABLED=0 guarantee for released
      # artifacts — the cross-build job below verifies that separately.
      - name: Run Tests (race detector)
        run: CGO_ENABLED=1 go test -race ./...

  cross-build:
    name: Cross-compile ${{ matrix.suffix }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: linux,   arch: amd64,              suffix: linux-amd64 }
          - { os: linux,   arch: arm64,              suffix: linux-arm64 }
          - { os: linux,   arch: arm,    arm_var: 7, suffix: linux-armv7 }
          - { os: linux,   arch: "386",              suffix: linux-386 }
          - { os: darwin,  arch: arm64,              suffix: darwin-arm64 }
          - { os: darwin,  arch: amd64,              suffix: darwin-amd64 }
          - { os: windows, arch: amd64,              suffix: windows-amd64 }
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.26'
          cache: true

      # Proves every release target still builds statically with cgo disabled.
      # Without this, a cross-compilation break (a dependency pulling in a
      # cgo-only path, or a syscall missing on arm) is only discovered at tag
      # time, when release.yml is the first thing to attempt these builds.
      - name: Build (CGO_ENABLED=0)
        env:
          GOOS: ${{ matrix.os }}
          GOARCH: ${{ matrix.arch }}
          GOARM: ${{ matrix.arm_var }}
          CGO_ENABLED: 0
        run: go build -trimpath -o /dev/null ./cmd/sendspin-voip
