name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    name: Test & Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.26'
          cache: true

      - name: Check formatting
        run: |
          out="$(gofmt -s -l .)"
          if [ -n "$out" ]; then
            echo "The following files are not gofmt'd:"
            echo "$out"
            exit 1
          fi

      - name: Vet
        run: go vet ./...

      # The race detector is built on cgo, so CGO_ENABLED must be 1 here.
      # Only the released binary is built with CGO_ENABLED=0.
      - name: Run Tests (race detector)
        run: CGO_ENABLED=1 go test -v -race ./...

      - name: Verify Static Build
        run: |
          CGO_ENABLED=0 go build -trimpath -o /tmp/sendspin-voip ./cmd/sendspin-voip
