<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sendspin VoIP Studio</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'><path fill='%2300f0ff' d='M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm-1 14.5v-9l6 4.5-6 4.5z'/></svg>">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg-canvas: #07090e;
      --bg-surface: rgba(13, 18, 30, 0.85);
      --bg-card: #0f172a;
      --bg-card-subtle: #141e33;
      --border-subtle: rgba(255, 255, 255, 0.08);
      --border-bright: rgba(255, 255, 255, 0.16);
      --border-glow: rgba(0, 240, 255, 0.35);
      --text-primary: #f8fafc;
      --text-secondary: #94a3b8;
      --text-muted: #64748b;
      --accent-cyan: #00f0ff;
      --accent-cyan-glow: rgba(0, 240, 255, 0.35);
      --accent-purple: #a855f7;
      --accent-emerald: #10b981;
      --accent-amber: #f59e0b;
      --accent-rose: #f43f5e;
      --font-sans: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
      --font-mono: 'JetBrains Mono', monospace;
      --radius-sm: 6px;
      --radius-md: 10px;
      --radius-lg: 14px;
      --shadow-glass: 0 16px 40px -10px rgba(0, 0, 0, 0.7), 0 0 1px 1px rgba(255, 255, 255, 0.06) inset;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background-color: var(--bg-canvas);
      background-image:
        radial-gradient(at 0% 0%, rgba(0, 240, 255, 0.06) 0px, transparent 50%),
        radial-gradient(at 100% 0%, rgba(168, 85, 247, 0.06) 0px, transparent 50%);
      background-attachment: fixed;
      color: var(--text-primary);
      font-family: var(--font-sans);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      -webkit-font-smoothing: antialiased;
    }

    header {
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      background: rgba(8, 11, 19, 0.9);
      border-bottom: 1px solid var(--border-subtle);
      position: sticky;
      top: 0;
      z-index: 100;
      padding: 0 2rem;
      height: 64px;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 12px;
      text-decoration: none;
    }

    .brand-icon {
      width: 36px;
      height: 36px;
      border-radius: var(--radius-md);
      background: linear-gradient(135deg, #00f0ff, #a855f7);
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 0 20px var(--accent-cyan-glow);
    }

    .brand-icon svg { width: 20px; height: 20px; fill: #06080e; }

    .brand-title {
      font-size: 1.1rem;
      font-weight: 800;
      letter-spacing: -0.02em;
      background: linear-gradient(90deg, #ffffff 0%, #cbd5e1 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .brand-badge {
      font-size: 0.65rem;
      font-family: var(--font-mono);
      padding: 2px 7px;
      border-radius: 4px;
      background: rgba(0, 240, 255, 0.12);
      color: var(--accent-cyan);
      border: 1px solid rgba(0, 240, 255, 0.25);
      font-weight: 700;
    }

    .nav-controls {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .search-box input {
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid var(--border-subtle);
      border-radius: var(--radius-md);
      padding: 7px 12px;
      color: var(--text-primary);
      font-family: var(--font-sans);
      font-size: 0.8rem;
      width: 200px;
      transition: all 0.2s ease;
    }

    .search-box input:focus {
      outline: none;
      border-color: var(--accent-cyan);
      background: rgba(255, 255, 255, 0.08);
      box-shadow: 0 0 12px var(--accent-cyan-glow);
      width: 240px;
    }

    .btn {
      background: rgba(255, 255, 255, 0.06);
      border: 1px solid var(--border-subtle);
      color: var(--text-primary);
      padding: 7px 12px;
      border-radius: var(--radius-md);
      font-size: 0.75rem;
      font-weight: 600;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      transition: all 0.2s ease;
      font-family: var(--font-sans);
    }

    .btn:hover {
      background: rgba(255, 255, 255, 0.12);
      border-color: rgba(255, 255, 255, 0.2);
    }

    main {
      flex: 1;
      padding: 1.5rem 2rem 3rem 2rem;
      max-width: 1600px;
      margin: 0 auto;
      width: 100%;
    }

    .studio-summary {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
      gap: 12px;
      margin-bottom: 1.5rem;
    }

    .stat-card {
      background: var(--bg-surface);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border: 1px solid var(--border-subtle);
      border-radius: var(--radius-md);
      padding: 1rem 1.2rem;
      box-shadow: var(--shadow-glass);
      display: flex;
      flex-direction: column;
      gap: 2px;
    }

    .stat-title {
      font-size: 0.68rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      color: var(--text-secondary);
    }

    .stat-value {
      font-size: 1.35rem;
      font-weight: 800;
      font-family: var(--font-mono);
      color: #fff;
    }

    .stat-meta {
      font-size: 0.72rem;
      color: var(--text-muted);
    }

    .streams-grid {
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    .stream-card {
      background: var(--bg-surface);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border: 1px solid var(--border-subtle);
      border-radius: var(--radius-lg);
      padding: 1.25rem 1.5rem;
      box-shadow: var(--shadow-glass);
      display: flex;
      flex-direction: column;
      gap: 14px;
      transition: border-color 0.2s ease, box-shadow 0.2s ease;
    }

    .stream-card.is-active {
      border-color: rgba(0, 240, 255, 0.3);
      box-shadow: 0 16px 40px -10px rgba(0, 240, 255, 0.1), 0 0 1px 1px rgba(0, 240, 255, 0.2) inset;
    }

    .stream-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-wrap: wrap;
      gap: 12px;
    }

    .player-title-row {
      display: flex;
      align-items: center;
      gap: 10px;
      flex-wrap: wrap;
    }

    .player-name {
      font-size: 1.1rem;
      font-weight: 800;
      color: #fff;
    }

    .player-target {
      font-family: var(--font-mono);
      font-size: 0.78rem;
      color: var(--accent-cyan);
      background: rgba(0, 240, 255, 0.08);
      padding: 2px 8px;
      border-radius: 4px;
      border: 1px solid rgba(0, 240, 255, 0.2);
    }

    .pill-tag {
      font-size: 0.65rem;
      font-family: var(--font-mono);
      font-weight: 700;
      text-transform: uppercase;
      padding: 3px 8px;
      border-radius: 4px;
      letter-spacing: 0.04em;
    }

    .tag-idle { background: rgba(255, 255, 255, 0.05); color: var(--text-muted); border: 1px solid var(--border-subtle); }
    .tag-live { background: rgba(16, 185, 129, 0.15); color: #34d399; border: 1px solid rgba(16, 185, 129, 0.35); }
    .tag-dialing { background: rgba(245, 158, 11, 0.15); color: #fbbf24; border: 1px solid rgba(245, 158, 11, 0.35); }
    .tag-linger { background: rgba(168, 85, 247, 0.15); color: #d8b4fe; border: 1px solid rgba(168, 85, 247, 0.35); }
    .tag-passthrough { background: rgba(0, 240, 255, 0.15); color: #67e8f9; border: 1px solid rgba(0, 240, 255, 0.35); }

    /* Track Metadata Banner */
    .track-meta-banner {
      background: var(--bg-card);
      border: 1px solid var(--border-subtle);
      border-radius: var(--radius-md);
      padding: 0.9rem 1.2rem;
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-wrap: wrap;
      gap: 12px;
    }

    .track-info {
      display: flex;
      flex-direction: column;
      gap: 3px;
    }

    .track-title {
      font-size: 0.95rem;
      font-weight: 700;
      color: #fff;
    }

    .track-artist-album {
      font-size: 0.78rem;
      color: var(--text-secondary);
    }

    .timecode-pill {
      font-family: var(--font-mono);
      font-size: 0.85rem;
      font-weight: 700;
      color: var(--accent-cyan);
      background: rgba(0, 240, 255, 0.08);
      padding: 4px 10px;
      border-radius: 6px;
      border: 1px solid rgba(0, 240, 255, 0.2);
    }

    /* Track Progress Visualizer */
    .progress-container {
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .progress-track-shell {
      position: relative;
      height: 10px;
      background: rgba(255, 255, 255, 0.06);
      border-radius: 5px;
      overflow: hidden;
      border: 1px solid rgba(255, 255, 255, 0.08);
    }

    .progress-bar-played {
      position: absolute;
      left: 0;
      top: 0;
      bottom: 0;
      background: linear-gradient(90deg, #6366f1, #a855f7, #ec4899);
      border-radius: 5px;
      transition: width 0.3s linear;
    }

    .progress-bar-buffer {
      position: absolute;
      left: 0;
      top: 0;
      bottom: 0;
      background: rgba(0, 240, 255, 0.25);
      border-radius: 5px;
      transition: width 0.3s linear;
    }

    .progress-labels {
      display: flex;
      justify-content: space-between;
      font-family: var(--font-mono);
      font-size: 0.7rem;
      color: var(--text-muted);
    }

    /* Pipeline Flow Bar */
    .pipeline-bar {
      background: var(--bg-card);
      border: 1px solid var(--border-subtle);
      border-radius: var(--radius-md);
      padding: 0.8rem 1.2rem;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .pipeline-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-wrap: wrap;
      gap: 10px;
    }

    .pipeline-flow-steps {
      display: flex;
      align-items: center;
      flex-wrap: wrap;
      gap: 8px;
      font-family: var(--font-mono);
      font-size: 0.75rem;
    }

    .pipeline-step {
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid var(--border-subtle);
      padding: 4px 8px;
      border-radius: 4px;
      color: var(--text-primary);
    }

    .step-source { border-color: rgba(0, 240, 255, 0.3); color: #67e8f9; }
    .step-target { border-color: rgba(168, 85, 247, 0.3); color: #d8b4fe; }

    .telemetry-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-wrap: wrap;
      gap: 12px;
      font-family: var(--font-mono);
      font-size: 0.72rem;
      color: var(--text-secondary);
      border-top: 1px solid rgba(255, 255, 255, 0.05);
      padding-top: 6px;
    }

    .modal-backdrop {
      position: fixed;
      top: 0; left: 0; right: 0; bottom: 0;
      background: rgba(0, 0, 0, 0.8);
      backdrop-filter: blur(12px);
      z-index: 1000;
      display: none;
      align-items: center;
      justify-content: center;
      padding: 1.5rem;
    }

    .modal-backdrop.open { display: flex; }

    .modal-box {
      background: #0f172a;
      border: 1px solid var(--border-bright);
      border-radius: var(--radius-lg);
      width: 100%;
      max-width: 700px;
      max-height: 85vh;
      display: flex;
      flex-direction: column;
      box-shadow: 0 25px 60px rgba(0,0,0,0.9);
      overflow: hidden;
    }

    .modal-header {
      padding: 1rem 1.5rem;
      border-bottom: 1px solid var(--border-subtle);
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .modal-body {
      padding: 1.5rem;
      overflow-y: auto;
      font-family: var(--font-mono);
      font-size: 0.8rem;
    }

    table.codec-table {
      width: 100%;
      border-collapse: collapse;
      text-align: left;
      font-size: 0.75rem;
    }

    table.codec-table th, table.codec-table td {
      padding: 8px 10px;
      border-bottom: 1px solid rgba(255, 255, 255, 0.06);
    }

    table.codec-table th {
      color: var(--text-secondary);
      text-transform: uppercase;
      font-size: 0.65rem;
    }
  </style>
</head>
<body>
  <header>
    <div class="brand">
      <div class="brand-icon">
        <svg viewBox="0 0 24 24"><path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm-1 14.5v-9l6 4.5-6 4.5z"/></svg>
      </div>
      <div>
        <div class="brand-title">Sendspin VoIP Studio</div>
      </div>
      <span class="brand-badge">LIVE ENGINE</span>
    </div>

    <div class="nav-controls">
      <div class="search-box">
        <input type="text" id="filterInput" placeholder="Filter players..." oninput="onFilterChange()">
      </div>
      <button class="btn" onclick="openCodecsModal()">Codecs</button>
      <span class="pill-tag tag-live" id="refreshLabel">SSE Live</span>
    </div>
  </header>

  <main>
    <div class="studio-summary">
      <div class="stat-card">
        <span class="stat-title">Active Streams</span>
        <span class="stat-value" id="statActiveStreams">0</span>
        <span class="stat-meta" id="statTotalStreams">0 players configured</span>
      </div>
      <div class="stat-card">
        <span class="stat-title">SIP Connection</span>
        <span class="stat-value" id="statSIPServer" style="font-size: 1.1rem; text-overflow: ellipsis; overflow: hidden; white-space: nowrap;">Connected</span>
        <span class="stat-meta" id="statSIPRegistered">PBX Trunk</span>
      </div>
      <div class="stat-card">
        <span class="stat-title">RTP Delivered</span>
        <span class="stat-value" id="statTotalPackets">0</span>
        <span class="stat-meta" id="statTotalBytes">0 B delivered</span>
      </div>
      <div class="stat-card">
        <span class="stat-title">System Uptime</span>
        <span class="stat-value" id="statUptime">0s</span>
        <span class="stat-meta" id="statMemory">0 MB Alloc</span>
      </div>
    </div>

    <div class="streams-grid" id="streamsContainer">
      <!-- Player cards injected dynamically -->
    </div>
  </main>

  <div class="modal-backdrop" id="codecsModal" onclick="closeCodecsModal(event)">
    <div class="modal-box" onclick="event.stopPropagation()">
      <div class="modal-header">
        <span style="font-weight: 700; color: #fff;">Supported Audio Codecs</span>
        <button class="btn" onclick="closeCodecsModal()">Close</button>
      </div>
      <div class="modal-body">
        <table class="codec-table">
          <thead>
            <tr>
              <th>Codec</th>
              <th>SDP Name</th>
              <th>Clock</th>
              <th>Rate</th>
              <th>Ch</th>
              <th>PT</th>
              <th>Description</th>
            </tr>
          </thead>
          <tbody id="codecTableBody"></tbody>
        </table>
      </div>
    </div>
  </div>

  <div class="modal-backdrop" id="jsonModal" onclick="closeJsonModal(event)">
    <div class="modal-box" onclick="event.stopPropagation()">
      <div class="modal-header">
        <span style="font-weight: 700; color: #fff;" id="jsonModalTitle">Telemetry Data</span>
        <button class="btn" onclick="closeJsonModal()">Close</button>
      </div>
      <div class="modal-body">
        <pre id="jsonModalCode" style="color: #67e8f9; font-size: 0.75rem; overflow-x: auto;"></pre>
      </div>
    </div>
  </div>

  <script>
    let globalStreams = {};
    let globalInfo = {};
    let filterQuery = '';

    function initSSE() {
      if (window.EventSource) {
        const evSource = new EventSource('/api/events');
        evSource.onmessage = function(e) {
          try {
            globalStreams = JSON.parse(e.data);
            renderStreams();
          } catch(err) {
            console.error('SSE parse error', err);
          }
        };
        evSource.onerror = function() {
          const lbl = document.getElementById('refreshLabel');
          if (lbl) {
            lbl.textContent = 'Polling';
            lbl.className = 'pill-tag tag-dialing';
          }
        };
      }
    }

    async function fetchData() {
      try {
        const [streamsRes, infoRes] = await Promise.all([
          fetch('/api/streams'),
          fetch('/api/info')
        ]);
        if (streamsRes.ok) {
          globalStreams = await streamsRes.json();
          renderStreams();
        }
        if (infoRes.ok) {
          globalInfo = await infoRes.json();
          renderSystemInfo();
        }
      } catch (err) {
        console.error('Fetch error:', err);
      }
    }

    function renderSystemInfo() {
      if (!globalInfo) return;
      document.getElementById('statActiveStreams').textContent = globalInfo.active_streams || 0;
      document.getElementById('statTotalStreams').textContent = `${globalInfo.total_streams || 0} players configured`;

      const sip = globalInfo.sip || {};
      document.getElementById('statSIPServer').textContent = sip.server || (sip.mode === 'direct' ? 'Direct P2P' : 'Connected');
      document.getElementById('statSIPRegistered').textContent = sip.registered ? 'Registered PBX Trunk' : (sip.mode === 'direct' ? 'P2P Direct' : 'Connecting...');

      const uptimeSec = Math.floor(globalInfo.uptime_sec || 0);
      let uptimeStr = `${uptimeSec}s`;
      if (uptimeSec >= 60) {
        const m = Math.floor(uptimeSec / 60);
        const h = Math.floor(m / 60);
        uptimeStr = h > 0 ? `${h}h ${m % 60}m` : `${m}m`;
      }
      document.getElementById('statUptime').textContent = uptimeStr;

      const mem = (globalInfo.memory_alloc_mb || 0).toFixed(1);
      document.getElementById('statMemory').textContent = `${mem} MB Alloc • ${globalInfo.goroutines || 0} Goroutines`;

      updateGlobalPacketCounters();
    }

    function updateGlobalPacketCounters() {
      let totalPackets = 0;
      let totalBytes = 0;
      for (const k of Object.keys(globalStreams || {})) {
        const st = globalStreams[k];
        if (st && st.consumers) {
          for (const c of st.consumers) {
            totalPackets += c.packets_sent || 0;
            totalBytes += c.bytes_sent || 0;
          }
        }
      }
      document.getElementById('statTotalPackets').textContent = totalPackets.toLocaleString();
      document.getElementById('statTotalBytes').textContent = `${formatBytes(totalBytes)} delivered`;
    }

    function onFilterChange() {
      filterQuery = (document.getElementById('filterInput').value || '').toLowerCase().trim();
      renderStreams();
    }

    function renderStreams() {
      const container = document.getElementById('streamsContainer');
      const allKeys = Object.keys(globalStreams || {});
      const filteredKeys = allKeys.filter(k => {
        if (!filterQuery) return true;
        const st = globalStreams[k];
        const name = (st.name || k).toLowerCase();
        const target = ((st.consumers && st.consumers[0]?.url) || '').toLowerCase();
        return name.includes(filterQuery) || target.includes(filterQuery);
      });

      if (filteredKeys.length === 0) {
        container.innerHTML = `<div style="padding: 24px; text-align: center; color: var(--text-muted);">${filterQuery ? 'No matching players.' : 'No players configured.'}</div>`;
        return;
      }

      // Render cards
      for (const id of filteredKeys) {
        const st = globalStreams[id];
        let card = document.getElementById(`card-${id}`);
        if (!card) {
          const wrapper = document.createElement('div');
          wrapper.innerHTML = createCardHTML(id, st);
          card = wrapper.firstElementChild;
          container.appendChild(card);
        }
        updateCardContent(id, st);
      }

      // Cleanup removed cards
      for (const existing of container.querySelectorAll('.stream-card')) {
        const cId = existing.id.replace('card-', '');
        if (!filteredKeys.includes(cId)) existing.remove();
      }

      updateGlobalPacketCounters();
    }

    function createCardHTML(id, st) {
      return `
      <div class="stream-card" id="card-${id}">
        <div class="stream-header">
          <div class="player-title-row">
            <span class="player-name" id="name-${id}">${escapeHTML(st.name || id)}</span>
            <span class="player-target" id="target-${id}">...</span>
            <span class="pill-tag tag-idle" id="badge-${id}">IDLE</span>
            <span id="group-badge-${id}"></span>
          </div>
          <div style="display: flex; align-items: center; gap: 8px;">
            <span class="timecode-pill" id="tc-${id}">00:00</span>
            <span class="pill-tag tag-idle" id="vol-${id}">100% (0 dB)</span>
            <button class="btn" onclick="inspectStreamJson('${id}')">JSON</button>
          </div>
        </div>

        <div class="track-meta-banner" id="banner-${id}">
          <div class="track-info">
            <span class="track-title" id="track-title-${id}">Idle</span>
            <span class="track-artist-album" id="track-artist-${id}">Ready for stream</span>
          </div>
          <div style="font-family: var(--font-mono); font-size: 0.75rem; color: var(--text-muted);" id="track-timing-${id}">--:-- / --:--</div>
        </div>

        <div class="progress-container">
          <div class="progress-track-shell">
            <div class="progress-bar-buffer" id="pbuf-${id}" style="width: 0%;"></div>
            <div class="progress-bar-played" id="pplay-${id}" style="width: 0%;"></div>
          </div>
          <div class="progress-labels">
            <span id="pos-label-${id}">00:00</span>
            <span id="buf-label-${id}" style="color: var(--accent-cyan);">Buffer: 0ms</span>
            <span id="dur-label-${id}">00:00</span>
          </div>
        </div>

        <div class="pipeline-bar">
          <div class="pipeline-row">
            <div class="pipeline-flow-steps" id="flow-${id}"></div>
            <div style="font-family: var(--font-mono); font-size: 0.72rem; color: var(--text-secondary);" id="sdp-${id}"></div>
          </div>
          <div class="telemetry-row" id="telem-${id}"></div>
        </div>
      </div>`;
    }

    function updateCardContent(id, st) {
      const card = document.getElementById(`card-${id}`);
      if (!card) return;

      const isPlaying = st.state === 'playing' || st.state === 'active';
      const isDialing = st.state === 'dialing';
      const isLingering = st.state === 'lingering';

      card.className = `stream-card ${isPlaying ? 'is-active' : ''}`;

      const prod = (st.producers && st.producers.length > 0) ? st.producers[0] : {};
      const cons = (st.consumers && st.consumers.length > 0) ? st.consumers[0] : {};
      const path = st.audio_path || {};

      document.getElementById(`name-${id}`).textContent = st.name || id;
      document.getElementById(`target-${id}`).textContent = cons.url || 'sip:target';

      const badge = document.getElementById(`badge-${id}`);
      if (isPlaying) {
        badge.textContent = 'STREAMING LIVE';
        badge.className = 'pill-tag tag-live';
      } else if (isDialing) {
        badge.textContent = 'SIP DIALING';
        badge.className = 'pill-tag tag-dialing';
      } else if (isLingering) {
        badge.textContent = 'LINGERING';
        badge.className = 'pill-tag tag-linger';
      } else {
        badge.textContent = (st.state || 'IDLE').toUpperCase();
        badge.className = 'pill-tag tag-idle';
      }

      const grpBadge = document.getElementById(`group-badge-${id}`);
      grpBadge.innerHTML = st.is_grouped ? '<span class="pill-tag tag-live">SYNC GROUP</span>' : '';

      const vol = (path.volume_percent != null ? path.volume_percent : st.volume) || 100;
      const volDbStr = vol >= 100 ? '0 dB' : (vol <= 0 ? 'Muted' : `${((vol/100)*60 - 60).toFixed(0)} dB`);
      document.getElementById(`vol-${id}`).textContent = st.muted ? 'Muted' : `${vol}% (${volDbStr})`;

      // Track Metadata & Progress
      const title = prod.title || prod.track || (isPlaying ? 'Active Playback' : 'Idle Track');
      const artist = prod.artist || '';
      const album = prod.album || '';
      document.getElementById(`track-title-${id}`).textContent = title;
      document.getElementById(`track-artist-${id}`).textContent = artist ? (album ? `${artist} • ${album}` : artist) : (album || 'Ready for stream');

      const trackDur = prod.track_duration_sec || 0;
      const trackProg = prod.track_progress_sec || 0;

      document.getElementById(`tc-${id}`).textContent = formatDuration(trackProg);
      document.getElementById(`track-timing-${id}`).textContent = trackDur > 0 ? `${formatDuration(trackProg)} / ${formatDuration(trackDur)}` : formatDuration(trackProg);

      // Progress bars
      const posLabel = document.getElementById(`pos-label-${id}`);
      const durLabel = document.getElementById(`dur-label-${id}`);
      const bufLabel = document.getElementById(`buf-label-${id}`);
      const pplay = document.getElementById(`pplay-${id}`);
      const pbuf = document.getElementById(`pbuf-${id}`);

      posLabel.textContent = formatDuration(trackProg);
      durLabel.textContent = trackDur > 0 ? formatDuration(trackDur) : formatDuration(Math.max(trackProg, 30));

      const effectiveTotal = trackDur > 0 ? trackDur : Math.max(trackProg + 10, 30);
      const playedPercent = Math.min(100, Math.max(0, (trackProg / effectiveTotal) * 100));
      pplay.style.width = `${playedPercent}%`;

      const upChunks = path.upstream_chunks || 0;
      const upSec = (upChunks * 20) / 1000;
      const bufPercent = Math.min(100, Math.max(0, ((trackProg + upSec) / effectiveTotal) * 100));
      pbuf.style.width = `${bufPercent}%`;

      bufLabel.textContent = isPlaying ? `Ingest: +${Math.round(upSec * 1000)}ms (${upChunks} chunks) • Ready: ${path.conversion_queue || 0} frames` : 'Idle';

      // Pipeline Flow
      const activeCodec = (cons.active_codec || cons.config_codec || 'g722').toUpperCase();
      const inCodec = (prod.codec || 'Opus').toUpperCase();
      const inRate = prod.sample_rate || 48000;
      const inCh = prod.channels || 2;
      const isPassthrough = path.passthrough || (activeCodec === 'OPUS' && vol >= 100 && inCodec === 'OPUS');

      const flow = document.getElementById(`flow-${id}`);
      flow.innerHTML = `
        <span class="pipeline-step step-source">SOURCE ${inCodec} ${inRate/1000}kHz ${inCh}ch</span>
        <span style="color: var(--text-muted);">➔</span>
        ${isPassthrough ? '<span class="pill-tag tag-passthrough">0-COPY PASSTHROUGH</span>' : '<span class="pill-tag tag-live">TRANSCODE</span>'}
        <span style="color: var(--text-muted);">➔</span>
        <span class="pipeline-step step-target">RTP ${activeCodec}</span>
      `;

      document.getElementById(`sdp-${id}`).innerHTML = `SDP: <strong style="color: var(--accent-emerald);">${escapeHTML(cons.negotiated_sdp || activeCodec)}</strong>`;

      // Telemetry
      const telem = document.getElementById(`telem-${id}`);
      telem.innerHTML = `
        <span>Remote RTP: <strong style="color: #fff;">${cons.remote_rtp || 'Pending'}</strong></span>
        <span>Local RTP: <strong style="color: #fff;">${cons.local_rtp || 'Auto'}</strong></span>
        <span>Packets: <strong style="color: #fff;">${(cons.packets_sent || 0).toLocaleString()}</strong></span>
        <span>Call-ID: <strong style="color: var(--text-primary);">${cons.call_id || 'Idle'}</strong></span>
      `;
    }

    async function openCodecsModal() {
      const modal = document.getElementById('codecsModal');
      modal.classList.add('open');
      try {
        const res = await fetch('/api/codecs');
        if (res.ok) {
          const data = await res.json();
          document.getElementById('codecTableBody').innerHTML = (data.codecs || []).map(c => `
            <tr>
              <td style="color: var(--accent-cyan); font-weight: 700;">${c.name}</td>
              <td style="color: #fff;">${c.sdp_name}</td>
              <td>${c.rtp_clock_rate} Hz</td>
              <td>${c.audio_sample_rate} Hz</td>
              <td>${c.channels} ch</td>
              <td>${c.payload_type}</td>
              <td style="color: var(--text-secondary);">${c.description || 'Standard codec'}</td>
            </tr>
          `).join('');
        }
      } catch(e) {
        console.error(e);
      }
    }

    function closeCodecsModal(e) {
      if (!e || e.target.id === 'codecsModal' || e.target.tagName === 'BUTTON') {
        document.getElementById('codecsModal').classList.remove('open');
      }
    }

    function inspectStreamJson(id) {
      const modal = document.getElementById('jsonModal');
      document.getElementById('jsonModalTitle').textContent = `Stream Telemetry: ${id}`;
      document.getElementById('jsonModalCode').textContent = JSON.stringify(globalStreams[id] || {}, null, 2);
      modal.classList.add('open');
    }

    function closeJsonModal(e) {
      if (!e || e.target.id === 'jsonModal' || e.target.tagName === 'BUTTON') {
        document.getElementById('jsonModal').classList.remove('open');
      }
    }

    function formatBytes(bytes) {
      if (!bytes || bytes === 0) return '0 B';
      const k = 1024;
      const sizes = ['B', 'KB', 'MB', 'GB'];
      const i = Math.floor(Math.log(bytes) / Math.log(k));
      return parseFloat((bytes / Math.pow(k, i)).toFixed(1)) + ' ' + sizes[i];
    }

    function formatDuration(sec) {
      if (!sec || sec <= 0) return '00:00';
      const m = Math.floor(sec / 60);
      const s = Math.floor(sec % 60);
      return `${m < 10 ? '0' : ''}${m}:${s < 10 ? '0' : ''}${s}`;
    }

    function escapeHTML(str) {
      if (!str) return '';
      return String(str)
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;')
        .replace(/'/g, '&#039;');
    }

    fetchData();
    initSSE();
    setInterval(fetchData, 1000);
  </script>
</body>
</html>
